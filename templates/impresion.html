<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Impresión Térmica - Juegos Patri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #areaImpresion, #areaImpresion * {
                visibility: visible;
            }
            #areaImpresion {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
            }
            @page {
                size: 58mm auto;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 max-w-md w-full text-center space-y-6">
        <h1 class="text-xl font-black text-amber-400">🖨️ Módulo de Impresión Automática</h1>
        <p class="text-xs text-slate-400">Mantén esta pestaña abierta en la computadora conectada a tu impresora térmica FTX TDR058U.</p>
        
        <div class="inline-flex items-center space-x-2 bg-slate-900 px-4 py-2 rounded-xl border border-slate-700">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <span id="estadoTexto" class="text-xs font-bold text-emerald-400">Sistema Activo y Escuchando Tickets...</span>
        </div>
        
        <div id="colaImpresion" class="text-xs text-slate-400 bg-slate-900/50 p-4 rounded-xl border border-slate-800 text-left max-h-40 overflow-y-auto">
            Esperando nuevos boletos aprobados...
        </div>
    </div>

    <!-- ZONA DE TICKET -->
    <div id="areaImpresion"></div>

    <script>
        async function verificarPendientes() {
            try {
                const res = await fetch('/api/pendientes-impresion');
                if (!res.ok) return;
                const boletos = await res.json();
                
                const colaDiv = document.getElementById('colaImpresion');
                if (boletos.length > 0) {
                    colaDiv.innerHTML = `Imprimiendo ${boletos.length} boleto(s) pendiente(s)...`;
                    const b = boletos[0];
                    await imprimirBoletoIndividual(b);
                } else {
                    colaDiv.innerHTML = "Cola vacía. Todo impreso correctamente.";
                }
            } catch (err) {
                console.error("Error consultando pendientes:", err);
            }
        }

        async function imprimirBoletoIndividual(b) {
            const area = document.getElementById('areaImpresion');
            const urlValidacion = `${window.location.origin}/validar/${b.id}`;
            
            // Usamos un tamaño de 150x150 pero forzamos un contenedor con margen blanco y alta definición (correction level H)
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&ecc=H&margin=2&data=${encodeURIComponent(urlValidacion)}`;

            area.innerHTML = `
                <div style="width: 100%; font-family: 'Courier New', monospace; background: white; color: black; padding: 4px 2px; text-align: center; font-size: 12px; line-height: 1.2;">
                    <div style="font-weight: bold; font-size: 14px;">JUEGOS PATRI</div>
                    <div style="font-size: 11px; margin: 2px 0; padding: 0 5px;">${b.sorteo_titulo}</div>
                    <div style="text-align: left; margin-top: 4px;"><strong>CLIENTE:</strong> ${b.nombre.toUpperCase()}</div>
                    <div style="text-align: left;"><strong>CI:</strong> ${b.cedula} | <strong>TEL:</strong> ${b.telefono}</div>
                    <div style="margin: 3px 0; font-size: 11px;">--------------------------------</div>
                    <div style="font-size: 11px; font-weight: bold;">NUMEROS ASIGNADOS:</div>
                    <div style="font-size: 20px; font-weight: bold; margin: 4px 0;">#${b.numero_asignado}</div>
                    <div style="margin: 3px 0; font-size: 11px;">--------------------------------</div>
                    <div style="font-size: 11px; font-weight: bold; margin-bottom: 4px;">¡Participas en los Juegos Locos!</div>
                    <div style="margin: 4px 0; background: white; padding: 4px; display: inline-block;">
                        <img src="${qrApiUrl}" width="130" height="130" style="display: block; margin: 0 auto; image-rendering: pixelated;" />
                    </div>
                </div>
            `;
            
            await new Promise(resolve => setTimeout(resolve, 300));
            
            window.print();
            
            area.innerHTML = '';
            try {
                await fetch(`/api/marcar-impreso/${b.id}`, { method: 'POST' });
            } catch (e) {
                console.error("Error marcando como impreso:", e);
            }
        }

        setInterval(verificarPendientes, 4000);
        verificarPendientes();
    </script>
</body>
</html>
