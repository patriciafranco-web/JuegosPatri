<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Impresión Silenciosa - Juegos Patri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #zonaTicket { display: none; }

        @media print {
            @page { size: 58mm auto; margin: 0mm; }
            html, body {
                background: white !important;
                color: black !important;
                margin: 0 !important;
                padding: 0 !important;
                min-height: auto !important;
                height: auto !important;
                display: block !important;
            }
            #panelControl { display: none !important; }
            #zonaTicket {
                display: block !important;
                width: 46mm !important;
                margin: 0 auto !important;
                padding-top: 2mm !important;
                padding-bottom: 12mm !important;
                font-family: monospace !important;
                text-align: center !important;
                background: white !important;
                color: black !important;
            }
            #zonaTicket h2 { margin: 2px 0 !important; font-size: 13px !important; font-weight: bold !important; }
            #zonaTicket p { margin: 2px 0 !important; font-size: 9px !important; line-height: 1.15 !important; word-break: break-word !important; }
            .linea { border-bottom: 1px dashed black !important; margin: 4px 0 !important; }
            .numeros { font-size: 12px !important; font-weight: bold !important; margin: 5px 0 !important; word-break: break-all !important; }
            .qr-box {
                margin: 6px auto !important;
                text-align: center !important;
                display: flex !important;
                justify-content: center !important;
            }
            .qr-box img {
                width: 26mm !important;
                height: 26mm !important;
                max-width: 26mm !important;
                display: block !important;
                margin: 0 auto !important;
            }
            .espacio-corte {
                display: block !important;
                margin-top: 8mm !important;
                font-size: 8px !important;
                color: black !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6 font-sans">
    
    <div id="panelControl" class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 max-w-lg w-full text-center space-y-6">
        <h1 class="text-2xl font-black text-amber-400">🖨️ Módulo de Impresión Automática</h1>
        <p class="text-sm text-slate-300">Mantén esta pestaña abierta en la computadora conectada a tu impresora térmica FTX TDR058U.</p>
        
        <div id="estadoConexion" class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-xs font-mono text-amber-400">
            ⏳ Esperando activación del sistema...
        </div>

        <button onclick="activarImpresion()" id="btnActivar" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl transition shadow-lg text-sm cursor-pointer">
            🚀 Activar Sistema Ahora
        </button>
    </div>

    <div id="zonaTicket"></div>

    <script>
        let sistemaActivo = false;
        let imprimiendo = false;

        function activarImpresion() {
            sistemaActivo = true;
            let cajaEstado = document.getElementById('estadoConexion');
            cajaEstado.className = "bg-slate-900 p-4 rounded-xl border border-emerald-500 text-xs font-mono text-emerald-400";
            cajaEstado.innerText = "🟢 Sistema Activo y Escuchando Tickets...";
            document.getElementById('btnActivar').style.display = 'none';
            
            verificarPendientes();
            setInterval(verificarPendientes, 4000);
        }

        async function verificarPendientes() {
            if (!sistemaActivo || imprimiendo) return;
            try {
                const res = await fetch('/api/pendientes-impresion');
                const pendientes = await res.json();
                
                if (pendientes && pendientes.length > 0) {
                    imprimiendo = true;
                    for (let lote of pendientes) {
                        await imprimirEnMismaPagina(lote);
                        await new Promise(r => setTimeout(r, 3000));
                    }
                    imprimiendo = false;
                }
            } catch (e) {
                console.error("Error consultando pendientes:", e);
                imprimiendo = false;
            }
        }

        function imprimirEnMismaPagina(lote) {
            return new Promise((resolve) => {
                const zona = document.getElementById('zonaTicket');
                // margin=2 agrega un borde blanco protector alrededor del QR para que nunca se corte
                const urlQr = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=2&data=https://juegospatri.onrender.com/validar/${lote.numeros_asignados[0]}`;

                zona.innerHTML = `
                    <h2>JUEGOS PATRI</h2>
                    <p>${lote.sorteo_titulo}</p>
                    <div class="linea"></div>
                    <p style="text-align:left;"><b>CLIENTE:</b> ${lote.nombre.toUpperCase()}</p>
                    <p style="text-align:left;"><b>CI:</b> ${lote.cedula} | <b>TEL:</b> ${lote.telefono}</p>
                    <div class="linea"></div>
                    <p><b>NUMEROS ASIGNADOS:</b></p>
                    <div class="numeros">${lote.numeros_asignados.map(n => '#' + n).join(', ')}</div>
                    <div class="linea"></div>
                    <p>¡Participas en los Juegos Locos!</p>
                    <div class="qr-box">
                        <img id="qrImg" src="${urlQr}">
                    </div>
                    <div class="espacio-corte">. . . . . . . . . . . .</div>
                `;

                const img = document.getElementById('qrImg');
                
                const lanzarImpresion = async () => {
                    window.print();
                    await fetch(`/api/marcar-impreso/${lote.id}`, { method: 'POST' });
                    resolve();
                };

                if (img.complete) {
                    setTimeout(lanzarImpresion, 250);
                } else {
                    img.onload = () => setTimeout(lanzarImpresion, 250);
                    img.onerror = () => setTimeout(lanzarImpresion, 250);
                }
            });
        }
    </script>
</body>
</html>
