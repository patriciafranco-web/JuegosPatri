<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Mesas y Cobros — Juegos Patri</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <header class="bg-slate-900 text-white px-4 py-3 shadow sticky top-0 z-20">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <span class="bg-emerald-600 font-black px-2.5 py-1 rounded-lg text-sm">JP</span>
        <div>
          <h1 class="font-black text-sm leading-tight">CONTROL DE MESAS Y COBRO</h1>
          <p class="text-[11px] text-slate-400">Juegos Patri • Gestión de rutas y relojes</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs font-bold">
        <a href="/cobrador" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg">📱 Modo Cobrador</a>
        <a href="/cobrador/qr-etiquetas" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-2 rounded-lg">🖨️ QR Mesas</a>
        <a href="/acceso" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg">🔀 Doble Acceso</a>
        <a href="/cobrador/logout" class="bg-rose-700 hover:bg-rose-600 text-white px-3 py-2 rounded-lg">Salir</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-4">
    <!-- RESUMEN RÁPIDO -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] font-bold text-slate-500 uppercase">Mesas Activas</span>
        <strong id="st-total" class="block text-2xl font-black text-slate-900 mt-1">0</strong>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] font-bold text-slate-500 uppercase">Con Saldo Pendiente</span>
        <strong id="st-saldo-cnt" class="block text-2xl font-black text-amber-700 mt-1">0</strong>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] font-bold text-slate-500 uppercase">Total a Cobrar</span>
        <strong id="st-cartera" class="block text-xl font-black text-emerald-700 mt-1">0 Gs.</strong>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] font-bold text-slate-500 uppercase">Con Ubicación GPS</span>
        <strong id="st-gps" class="block text-2xl font-black text-sky-700 mt-1">0</strong>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
      <input id="p-buscador" type="text" oninput="cargarPanel()"
        placeholder="Buscar por mesa, señor, ciudad o lugar..."
        class="px-3.5 py-2 border border-slate-300 rounded-xl bg-slate-50" />
      <select id="p-ciudad" onchange="cargarPanel()"
        class="px-3.5 py-2 border border-slate-300 rounded-xl bg-slate-50 font-semibold">
        <option value="">Todas las ciudades</option>
      </select>
      <label class="flex items-center gap-2 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold cursor-pointer">
        <input id="p-solo-deuda" type="checkbox" onchange="cargarPanel()" class="accent-amber-600 w-4 h-4" />
        <span>Mostrar solo mesas con saldo pendiente</span>
      </label>
    </section>

    <!-- TABLA DE MESAS -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead class="bg-slate-900 text-white uppercase text-[11px]">
            <tr>
              <th class="py-3 px-3">Mesa</th>
              <th class="py-3 px-3">Cliente</th>
              <th class="py-3 px-3">Ciudad / Lugar</th>
              <th class="py-3 px-3">Tarifa</th>
              <th class="py-3 px-3">Último Reloj</th>
              <th class="py-3 px-3">Saldo</th>
              <th class="py-3 px-3 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="p-tabla" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const fmt = (n) => Number(n || 0).toLocaleString('es-PY');

    async function cargarPanel() {
      const q = document.getElementById('p-buscador').value;
      const ciudad = document.getElementById('p-ciudad').value;
      const soloDeuda = document.getElementById('p-solo-deuda').checked;

      const res = await fetch(`/api/jp/clientes?q=${encodeURIComponent(q)}&ciudad=${encodeURIComponent(ciudad)}`);
      if (!res.ok) return;
      const data = await res.json();

      let lista = data.clientes || [];
      if (soloDeuda) {
        lista = lista.filter(c => Number(c.saldo_actual || 0) > 0);
      }

      const selCiudad = document.getElementById('p-ciudad');
      const actualCiudad = selCiudad.value;
      selCiudad.innerHTML = '<option value="">Todas las ciudades</option>' +
        (data.ciudades || []).map(c => `<option value="${c}" ${c === actualCiudad ? 'selected' : ''}>${c}</option>`).join('');

      const conSaldo = lista.filter(c => Number(c.saldo_actual || 0) > 0);
      const totalCartera = conSaldo.reduce((acc, c) => acc + Number(c.saldo_actual || 0), 0);
      const conGps = lista.filter(c => Boolean((c.maps_url || '').trim())).length;

      document.getElementById('st-total').textContent = fmt(lista.length);
      document.getElementById('st-saldo-cnt').textContent = fmt(conSaldo.length);
      document.getElementById('st-cartera').textContent = fmt(totalCartera) + ' Gs.';
      document.getElementById('st-gps').textContent = fmt(conGps);

      document.getElementById('p-tabla').innerHTML = lista.length
        ? lista.map(c => `
            <tr class="hover:bg-slate-50">
              <td class="py-2.5 px-3 font-black">Mesa ${c.mesa_num}</td>
              <td class="py-2.5 px-3 font-bold text-slate-900">${c.senor}</td>
              <td class="py-2.5 px-3 text-slate-600">${c.ciudad || ''} ${c.lugar ? '• ' + c.lugar : ''}</td>
              <td class="py-2.5 px-3 font-semibold">${fmt(c.tarifa)} Gs.</td>
              <td class="py-2.5 px-3 font-bold">${fmt(c.ultimo_reloj)}</td>
              <td class="py-2.5 px-3">
                <span class="px-2 py-0.5 rounded font-black ${Number(c.saldo_actual || 0) > 0 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                  ${fmt(c.saldo_actual)} Gs.
                </span>
              </td>
              <td class="py-2.5 px-3 text-right whitespace-nowrap space-x-1">
                <a href="/cobrador?mesa=${encodeURIComponent(c.mesa_num)}" class="inline-block bg-emerald-600 text-white px-2.5 py-1 rounded font-bold">Cargar</a>
                ${c.maps_url ? `<a href="${c.maps_url}" target="_blank" class="inline-block bg-sky-600 text-white px-2.5 py-1 rounded font-bold">GPS</a>` : ''}
              </td>
            </tr>
          `).join('')
        : '<tr><td colspan="7" class="py-6 text-center text-slate-400">No hay mesas para mostrar.</td></tr>';
    }

    cargarPanel();
  </script>
</body>
</html>
